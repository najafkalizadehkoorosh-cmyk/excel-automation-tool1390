name: Build Windows App

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name ExcelAutomationTool main.py
      - name: Smoke test executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/ExcelAutomationTool.exe")) { throw "Executable was not created." }
          $size = (Get-Item "dist/ExcelAutomationTool.exe").Length
          if ($size -lt 1000000) { throw "Executable is unexpectedly small ($size bytes)." }
          Write-Host "Executable smoke check passed: $size bytes"
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ExcelAutomationTool-Windows
          path: dist/ExcelAutomationTool.exe
          if-no-files-found: error
