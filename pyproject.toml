[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-automation-tool"
version = "0.1.0"
description = "Automate Excel and CSV data cleaning, processing, and reporting."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
]

[project.scripts]
excel-automation = "src.excel_automation.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
