[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-automation-tool"
version = "0.3.0"
description = "Desktop automation for cleaning and batch-processing Excel and CSV files."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
]

[project.scripts]
excel-automation = "src.excel_automation.cli:main"
excel-automation-gui = "src.excel_automation.gui:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
